engines:
- imagemagick
- exiftool
apt:
- build-essential
- pkg-config
- git
- ca-certificates
- fonts-dejavu-core
pip:
- numpy==2.1.3
run:
- curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.95.0 && git clone https://github.com/ray-r-ren/lightcraft
  /opt/lightcraft-src && cd /opt/lightcraft-src && git checkout 32d569ad5d19a6b55cf8d5c077127faa0f44a83b && CARGO_BUILD_JOBS=4
  CARGO_PROFILE_RELEASE_DEBUG=0 /root/.cargo/bin/cargo build --release --locked -p lightcraft-cli && install -m755
  target/release/lightcraft-cli /usr/local/bin/lightcraft-cli && mkdir -p /usr/share/doc/lightcraft /usr/share/lightcraft
  && cp LICENSE-APACHE LICENSE-MIT NOTICE README.md /usr/share/doc/lightcraft/ && cp -r assets /usr/share/lightcraft/assets
  && cd / && rm -rf /opt/lightcraft-src /root/.cargo /root/.rustup
- sed -i '/\.cargo\/env/d' /root/.bashrc /root/.profile 2>/dev/null || true
smoke:
- lightcraft-cli controls --json | head -c 300
- lightcraft-cli commands --json | grep -c '"id"'
- convert -size 256x192 gradient:navy-orange /tmp/smoke.png && lightcraft-cli render /tmp/smoke.png -o /tmp/smoke_out.jpg
  --set light.exposure=0.5 && test -s /tmp/smoke_out.jpg && identify /tmp/smoke_out.jpg
- lightcraft-cli run --demo library.info
