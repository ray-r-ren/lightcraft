schema_version = "1.4"
source = "skillnet"
artifacts = ["/task/outputs", "/task/answer.txt"]

[task]
name = "skillnet/pro-photo-darkroom-straighten_crop_instagram"
description = "Pro Photo Darkroom — Retouch photos: The horizon in this coast photo is crooked. Please straighten it and crop it to a 4:5 portrait shape for Instagram, then give me the finished JPEG."
keywords = ["skillnet", "pro-photo-darkroom", "retouch-photos"]

[[task.authors]]
name = "SkillNet Agent"

[metadata]
[metadata.skillnet]
skill = "pro-photo-darkroom"
version = 1
task = "straighten_crop_instagram"
ability = "Retouch photos"
core = true
source = "builder"
judge = "programmatic"
prompt = "The horizon in this coast photo is crooked. Please straighten it and crop it to a 4:5 portrait shape for Instagram, then give me the finished JPEG."

[agent]
timeout_sec = 900
user = "agent"

[verifier]
timeout_sec = 600
environment_mode = "separate"

[environment]
build_timeout_sec = 1800
cpus = 4
memory_mb = 6144
workdir = "/task"
network_mode = "allowlist"
allowed_hosts = ["skillnet.sh"]

[[environment.mcp_servers]]
name = "skillnet"
transport = "streamable-http"
url = "https://skillnet.sh/mcp"

[environment.mcp_servers.headers]
Authorization = "Bearer ${SKILLNET_API_KEY}"
