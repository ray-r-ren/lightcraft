schema_version = "1.4"
source = "skillnet"
artifacts = ["/task/outputs", "/task/answer.txt"]

[task]
name = "skillnet/pro-photo-darkroom-batch_warm_export"
description = "Pro Photo Darkroom — Batch export: Here are four photos from the same afternoon. Give them all the same warm, golden look, export them as JPEGs at 1600 pixels on the long edge in one zip, and mak"
keywords = ["skillnet", "pro-photo-darkroom", "batch-export"]

[[task.authors]]
name = "SkillNet Agent"

[metadata]
[metadata.skillnet]
skill = "pro-photo-darkroom"
version = 2
task = "batch_warm_export"
ability = "Batch export"
core = true
source = "builder"
judge = "programmatic"
prompt = "Here are four photos from the same afternoon. Give them all the same warm, golden look, export them as JPEGs at 1600 pixels on the long edge in one zip, and make me a contact sheet PDF so I can review them together."

[agent]
timeout_sec = 900
user = "agent"

[verifier]
timeout_sec = 600
environment_mode = "separate"

[environment]
build_timeout_sec = 1800
cpus = 4
memory_mb = 6144
workdir = "/task"
network_mode = "allowlist"
allowed_hosts = ["skillnet.sh"]

[[environment.mcp_servers]]
name = "skillnet"
transport = "streamable-http"
url = "https://skillnet.sh/mcp"

[environment.mcp_servers.headers]
Authorization = "Bearer ${SKILLNET_API_KEY}"
