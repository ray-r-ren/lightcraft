schema_version = "1.4"
source = "skillnet"
artifacts = ["/task/outputs", "/task/answer.txt"]

[task]
name = "skillnet/pro-photo-darkroom-inspect_exposure_report"
description = "Pro Photo Darkroom — Inspect photos: Before I start editing, I need a quick check of these three photos from my trip. Tell me which one is overexposed, which one is underexposed and which one is fi"
keywords = ["skillnet", "pro-photo-darkroom", "inspect-photos"]

[[task.authors]]
name = "SkillNet Agent"

[metadata]
[metadata.skillnet]
skill = "pro-photo-darkroom"
version = 2
task = "inspect_exposure_report"
ability = "Inspect photos"
core = true
source = "builder"
judge = "programmatic"
prompt = "Before I start editing, I need a quick check of these three photos from my trip. Tell me which one is overexposed, which one is underexposed and which one is fine — one line per photo, like `photo.jpg: overexposed`, `photo.jpg: underexposed` or `photo.jpg: fine`. Also tell me which camera model took them and the ISO of the forest shot."

[agent]
timeout_sec = 900
user = "agent"

[verifier]
timeout_sec = 600
environment_mode = "separate"

[environment]
build_timeout_sec = 1800
cpus = 4
memory_mb = 6144
workdir = "/task"
network_mode = "allowlist"
allowed_hosts = ["skillnet.sh"]

[[environment.mcp_servers]]
name = "skillnet"
transport = "streamable-http"
url = "https://skillnet.sh/mcp"

[environment.mcp_servers.headers]
Authorization = "Bearer ${SKILLNET_API_KEY}"
