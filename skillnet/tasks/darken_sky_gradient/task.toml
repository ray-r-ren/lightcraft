schema_version = "1.4"
source = "skillnet"
artifacts = ["/task/outputs", "/task/answer.txt"]

[task]
name = "skillnet/pro-photo-darkroom-darken_sky_gradient"
description = "Pro Photo Darkroom — Local adjustments: In this landscape the sky is much brighter than the field. Darken only the sky at the top with a soft graduated filter and leave the field exactly as it is. I n"
keywords = ["skillnet", "pro-photo-darkroom", "local-adjustments"]

[[task.authors]]
name = "SkillNet Agent"

[metadata]
[metadata.skillnet]
skill = "pro-photo-darkroom"
version = 1
task = "darken_sky_gradient"
ability = "Local adjustments"
core = false
source = "builder"
judge = "programmatic"
prompt = "In this landscape the sky is much brighter than the field. Darken only the sky at the top with a soft graduated filter and leave the field exactly as it is. I need the edited JPEG back."

[agent]
timeout_sec = 900
user = "agent"

[verifier]
timeout_sec = 600
environment_mode = "separate"

[environment]
build_timeout_sec = 1800
cpus = 4
memory_mb = 6144
workdir = "/task"
network_mode = "allowlist"
allowed_hosts = ["skillnet.sh"]

[[environment.mcp_servers]]
name = "skillnet"
transport = "streamable-http"
url = "https://skillnet.sh/mcp"

[environment.mcp_servers.headers]
Authorization = "Bearer ${SKILLNET_API_KEY}"
