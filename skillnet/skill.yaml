manifest_version: 1
name: Pro Photo Darkroom
slug: pro-photo-darkroom
superpower: Give it your photos. Get them professionally graded and retouched, originals untouched.
category: creative-media
cant_do:
  - Generative fill or AI object removal (spot healing is non-generative patching)
  - AI Denoise, Super Resolution, and SAM 'Object'/'Describe' masks (need separately installed model weights)
  - Video editing, slideshows with music, books or map views
  - Face detection or recognising people
  - HDR/panorama merging (not wrapped in this version)
  - Compressed Olympus ORF/Samsung SRW, Nikon HE NEF and some CR3 variants (only embedded previews)
  - Exact camera-maker colour (Lightroom/Capture One looks are approximated, not matched)
  - Printing to a physical printer
  - HEIC photos (export them as JPEG first)
example_prompts:
  - Make these 12 wedding photos warm and filmic, same look on all, and give me 2048px JPEGs
  - This sunset is blown out — recover the sky and brighten the foreground
  - Crop this portrait to 4:5, straighten it and remove the dust spots
  - Turn this street photo into a moody black and white with grain
  - Darken the sky with a gradient and add a soft vignette
  - Export my edited shoot as full-size TIFFs and a contact sheet PDF
engines:
  - id: imagemagick
    version: catalogue
  - id: exiftool
    version: catalogue
resources:
  cpu: 4
  memory_mib: 6144
  gpu: null
  timeout_s: 1800
  max_input_mb: 200
egress: []
credentials: []
agent_side: []
cost:
  typical_seconds: 15
sdk_version: 0.3.0
tools_package: tools
tools:
  - name: adjust_area
    title: Adjust part of a photo (masks)
    kind: edit
    description: "Use when only part of a photo should change: 'darken the sky', 'brighten the face', 'warm the sunset glow', 'add a vignette spotlight', 'make the greens pop'. Adds masks (radial, linear gradient, luminance range, colour range, automatic sky/subject/background; invert or subtract a second shape), each with local exposure, contrast, highlights, shadows, temperature, clarity, saturation and more, on top of an optional look_file. Returns the edited image, a mask overlay showing where each mask applied (measured), and an updated look.json. Use after grade_photo; the original is never modified."
    input_schema:
      additionalProperties: false
      properties:
        photo:
          description: The photo (file id or https URL); never modified.
          format: skillnet-file
          type: string
          x-accept:
            - .3fr
            - .arw
            - .avif
            - .cr2
            - .cr3
            - .crw
            - .dng
            - .erf
            - .heic
            - .heif
            - .hif
            - .iiq
            - .jpeg
            - .jpg
            - .jxl
            - .kdc
            - .mef
            - .mos
            - .mrw
            - .nef
            - .nrw
            - .orf
            - .pef
            - .png
            - .psd
            - .raf
            - .raw
            - .rw2
            - .rwl
            - .sr2
            - .srf
            - .srw
            - .tif
            - .tiff
            - .webp
            - .x3f
        masks:
          description: One or more masked adjustments.
          items:
            additionalProperties: false
            properties:
              kind:
                description: radial (ellipse), linear (gradient), luminance (tonal range), color (colour picked at `pick`), sky, subject, background (automatic, heuristic).
                enum:
                  - radial
                  - linear
                  - luminance
                  - color
                  - sky
                  - subject
                  - background
                type: string
              center:
                maxItems: 2
                minItems: 2
                prefixItems:
                  - type: number
                  - type: number
                type: array
                description: "radial: ellipse centre [x, y], 0-1 from top-left."
              rx:
                exclusiveMinimum: 0
                maximum: 2
                type: number
                description: "radial: horizontal radius, fraction of the long edge (e.g. 0.2)."
              ry:
                exclusiveMinimum: 0
                maximum: 2
                type: number
                description: "radial: vertical radius, fraction of the long edge."
              angle:
                default: 0
                description: "radial: rotation in degrees."
                maximum: 180
                minimum: -180
                type: number
              feather:
                default: 50
                description: "radial: edge softness 0-100."
                maximum: 100
                minimum: 0
                type: number
              start:
                maxItems: 2
                minItems: 2
                prefixItems:
                  - type: number
                  - type: number
                type: array
                description: "linear: [x, y] where the effect is full (0-1 coords)."
              end:
                maxItems: 2
                minItems: 2
                prefixItems:
                  - type: number
                  - type: number
                type: array
                description: "linear: [x, y] where the effect has faded to none."
              lum_lo:
                default: 0
                description: "luminance: lower bound 0 (black)..1 (white)."
                maximum: 1
                minimum: 0
                type: number
              lum_hi:
                default: 1
                description: "luminance: upper bound."
                maximum: 1
                minimum: 0
                type: number
              lum_feather:
                default: 0.1
                description: "luminance: falloff width."
                maximum: 1
                minimum: 0
                type: number
              pick:
                maxItems: 2
                minItems: 2
                prefixItems:
                  - type: number
                  - type: number
                type: array
                description: "color: [x, y] of a pixel whose colour to select."
              refine:
                default: 50
                description: "color: how wide the colour range is (higher = more similar colours)."
                maximum: 100
                minimum: 0
                type: number
              invert:
                default: false
                description: Apply everywhere EXCEPT the shape.
                type: boolean
              subtract:
                additionalProperties: false
                properties:
                  kind:
                    description: radial (ellipse), linear (gradient), luminance (tonal range), color (colour picked at `pick`), sky, subject, background (automatic, heuristic).
                    enum:
                      - radial
                      - linear
                      - luminance
                      - color
                      - sky
                      - subject
                      - background
                    type: string
                  center:
                    maxItems: 2
                    minItems: 2
                    prefixItems:
                      - type: number
                      - type: number
                    type: array
                    description: "radial: ellipse centre [x, y], 0-1 from top-left."
                  rx:
                    exclusiveMinimum: 0
                    maximum: 2
                    type: number
                    description: "radial: horizontal radius, fraction of the long edge (e.g. 0.2)."
                  ry:
                    exclusiveMinimum: 0
                    maximum: 2
                    type: number
                    description: "radial: vertical radius, fraction of the long edge."
                  angle:
                    default: 0
                    description: "radial: rotation in degrees."
                    maximum: 180
                    minimum: -180
                    type: number
                  feather:
                    default: 50
                    description: "radial: edge softness 0-100."
                    maximum: 100
                    minimum: 0
                    type: number
                  start:
                    maxItems: 2
                    minItems: 2
                    prefixItems:
                      - type: number
                      - type: number
                    type: array
                    description: "linear: [x, y] where the effect is full (0-1 coords)."
                  end:
                    maxItems: 2
                    minItems: 2
                    prefixItems:
                      - type: number
                      - type: number
                    type: array
                    description: "linear: [x, y] where the effect has faded to none."
                  lum_lo:
                    default: 0
                    description: "luminance: lower bound 0 (black)..1 (white)."
                    maximum: 1
                    minimum: 0
                    type: number
                  lum_hi:
                    default: 1
                    description: "luminance: upper bound."
                    maximum: 1
                    minimum: 0
                    type: number
                  lum_feather:
                    default: 0.1
                    description: "luminance: falloff width."
                    maximum: 1
                    minimum: 0
                    type: number
                  pick:
                    maxItems: 2
                    minItems: 2
                    prefixItems:
                      - type: number
                      - type: number
                    type: array
                    description: "color: [x, y] of a pixel whose colour to select."
                  refine:
                    default: 50
                    description: "color: how wide the colour range is (higher = more similar colours)."
                    maximum: 100
                    minimum: 0
                    type: number
                required:
                  - kind
                type: object
                description: Optional second shape removed from this mask (e.g. sky minus a radial over a building).
              adjustments:
                additionalProperties:
                  type: number
                description: "Local sliders: exposure (stops, -4..4), contrast, highlights, shadows, whites, blacks, temp (+warm/-cool), tint, texture, clarity, dehaze, hue, saturation, sharpness, noise (-100..100), color_hue…"
                type: object
              amount:
                default: 100
                description: Overall strength of this mask's effect, %.
                maximum: 200
                minimum: 0
                type: number
            required:
              - kind
              - adjustments
            type: object
          maxItems: 12
          minItems: 1
          type: array
        look_file:
          format: skillnet-file
          type: string
          x-accept:
            - .json
          description: look.json from an earlier call to build on.
        preview_size:
          default: 2048
          description: Long edge of the returned image, px.
          maximum: 8192
          minimum: 256
          type: integer
      required:
        - photo
        - masks
      type: object
    output_schema:
      additionalProperties: false
      properties:
        masks_applied:
          items:
            additionalProperties: false
            properties:
              kind:
                type: string
              coverage_pct:
                description: "% of the frame the mask affects noticeably (measured)."
                type: number
              adjustments:
                additionalProperties:
                  type: number
                type: object
              inside_luminance_before:
                type: number
              inside_luminance_after:
                type: number
              outside_luminance_before:
                type: number
              outside_luminance_after:
                type: number
            required:
              - kind
              - coverage_pct
              - adjustments
              - inside_luminance_before
              - inside_luminance_after
              - outside_luminance_before
              - outside_luminance_after
            type: object
          type: array
        before:
          additionalProperties: false
          properties:
            mean_luminance:
              type: number
            clipped_highlights_pct:
              type: number
            clipped_shadows_pct:
              type: number
            contrast_std:
              type: number
            mean_saturation:
              type: number
            warmth:
              description: "Mean red minus blue: higher = warmer. after - before shows the colour temperature change."
              type: number
          required:
            - mean_luminance
            - clipped_highlights_pct
            - clipped_shadows_pct
            - contrast_std
            - mean_saturation
            - warmth
          type: object
        after:
          additionalProperties: false
          properties:
            mean_luminance:
              type: number
            clipped_highlights_pct:
              type: number
            clipped_shadows_pct:
              type: number
            contrast_std:
              type: number
            mean_saturation:
              type: number
            warmth:
              description: "Mean red minus blue: higher = warmer. after - before shows the colour temperature change."
              type: number
          required:
            - mean_luminance
            - clipped_highlights_pct
            - clipped_shadows_pct
            - contrast_std
            - mean_saturation
            - warmth
          type: object
      required:
        - masks_applied
        - before
        - after
      type: object
    long_running: false
    timeout_s: 400
  - name: export_photos
    title: Apply a look to many photos and export
    kind: export
    description: "Use when the user wants the finished files: 'export full size', 'save as JPEG/TIFF for print', 'web-size copies', 'same look on all photos from the shoot', 'contact sheet'. Final step: applies one look.json and/or preset to every photo (one consistent grade) and exports JPEG, PNG, TIFF (8/16-bit), WebP, AVIF, JPEG XL, or the untouched original plus an XMP edit sidecar, with size, quality and colour space options and an optional contact-sheet PDF. Returns one zip and per-photo results (size, bytes, failures); large batches are split across several machines."
    input_schema:
      additionalProperties: false
      properties:
        photos:
          description: The photos to export (file ids from upload_file or https URLs), 1-200. Originals are never modified.
          items:
            format: skillnet-file
            type: string
            x-accept:
              - .json
          maxItems: 200
          minItems: 1
          type: array
        look_file:
          format: skillnet-file
          type: string
          x-accept:
            - .json
          description: look.json from grade_photo / adjust_area / retouch_photo, applied to every photo. Spot, red-eye, crop position and upright edits only carry over to the photo they were made on.
        preset:
          maxLength: 80
          type: string
          description: Optional preset look id (list_looks) applied after the look file.
        preset_amount:
          default: 100
          description: Preset strength, 0-200 %.
          maximum: 200
          minimum: 0
          type: number
        format:
          default: jpeg
          description: jpeg, png, tiff, webp, avif, jxl (JPEG XL), or original_xmp = the untouched original plus an XMP edit sidecar ('Lightroom-compatible', 'keep my raw').
          enum:
            - jpeg
            - png
            - tiff
            - webp
            - avif
            - jxl
            - original_xmp
          type: string
        long_edge:
          default: 3000
          description: Long edge in px; 0 = full size. 'For Instagram' ≈ 1080, 'for web' ≈ 2048.
          maximum: 20000
          minimum: 0
          type: integer
        quality:
          default: 90
          description: JPEG/WebP/AVIF/JPEG XL quality 1-100.
          maximum: 100
          minimum: 1
          type: integer
        color_space:
          default: srgb
          description: srgb (web, phones; default), display_p3 (Apple wide gamut), adobe_rgb (print).
          enum:
            - srgb
            - display_p3
            - adobe_rgb
          type: string
        bit_depth:
          default: 8
          description: 16 only for png and tiff (editing masters).
          enum:
            - 8
            - 16
          type: integer
        contact_sheet:
          default: false
          description: Also make a contact-sheet PDF of thumbnails with file names.
          type: boolean
        paper:
          default: a4
          description: Contact sheet paper size.
          enum:
            - a4
            - letter
          type: string
        columns:
          default: 4
          description: Contact sheet thumbnails per row.
          maximum: 10
          minimum: 1
          type: integer
        rows:
          default: 5
          description: Contact sheet rows per page.
          maximum: 12
          minimum: 1
          type: integer
      required:
        - photos
      type: object
    output_schema:
      additionalProperties: false
      properties:
        exported:
          type: integer
        failed:
          items:
            additionalProperties: false
            properties:
              name:
                type: string
              ok:
                type: boolean
              width:
                default: 0
                type: integer
              height:
                default: 0
                type: integer
              bytes:
                default: 0
                type: integer
              reason:
                type: string
            required:
              - name
              - ok
            type: object
          type: array
        photos:
          items:
            additionalProperties: false
            properties:
              name:
                type: string
              ok:
                type: boolean
              width:
                default: 0
                type: integer
              height:
                default: 0
                type: integer
              bytes:
                default: 0
                type: integer
              reason:
                type: string
            required:
              - name
              - ok
            type: object
          type: array
        format:
          type: string
        contact_sheet_pages:
          type: integer
        zip_bytes:
          type: integer
      required:
        - exported
        - failed
        - photos
        - format
        - contact_sheet_pages
        - zip_bytes
      type: object
    long_running: true
    timeout_s: 1800
  - name: grade_photo
    title: Grade a photo (look, tone and colour)
    kind: edit
    description: "After inspect_photo, use to make a photo look better or give it a style: 'brighten it', 'recover the sky', 'make it warmer', 'film look', 'black and white'. Applies a preset look (0-200 %), auto tone, a colour profile, B&W, a measured warmer/cooler shift (warmth) and global sliders (exposure, contrast, highlights, shadows, whites, blacks, white balance, vibrance, clarity, dehaze, vignette, grain, colour grading, HSL mixer, tone curve). Returns a NEW graded image, a before/after, brightness/clipping/warmth stats before→after and look.json to pass to the next call. The original is never modified."
    input_schema:
      additionalProperties: false
      properties:
        photo:
          description: "The photo to grade (file id from upload_file or an https URL). Never modified: a new graded copy is written."
          format: skillnet-file
          type: string
          x-accept:
            - .3fr
            - .arw
            - .avif
            - .cr2
            - .cr3
            - .crw
            - .dng
            - .erf
            - .heic
            - .heif
            - .hif
            - .iiq
            - .jpeg
            - .jpg
            - .jxl
            - .kdc
            - .mef
            - .mos
            - .mrw
            - .nef
            - .nrw
            - .orf
            - .pef
            - .png
            - .psd
            - .raf
            - .raw
            - .rw2
            - .rwl
            - .sr2
            - .srf
            - .srw
            - .tif
            - .tiff
            - .webp
            - .x3f
        preset:
          maxLength: 80
          type: string
          description: A preset look id from list_looks, e.g. 'lc.golden-hour', 'lc.teal-orange', 'lc.faded-matte', 'lc.bw-high-contrast'.
        preset_amount:
          default: 100
          description: Strength of the preset look, 0-200 %.
          maximum: 200
          minimum: 0
          type: number
        profile:
          maxLength: 80
          type: string
          description: Optional colour profile id from list_looks (e.g. 'lc.vivid', 'lc.landscape', 'lc.mono').
        auto_tone:
          default: false
          description: Let the engine set exposure, contrast, highlights, shadows, whites and blacks automatically (applied before the preset and sliders).
          type: boolean
        black_and_white:
          default: false
          description: Convert to black & white (with an automatic B&W mix unless bw.* sliders are given).
          type: boolean
        adjustments:
          additionalProperties:
            type: number
          type: object
          description: "Global sliders as control id → value, applied last, e.g. {\"light.exposure\": 0.5, \"light.highlights\": -60, \"color.vibrance\": 20, \"wb.temp\": 5800}. Exposure is in stops (-5..5), most others -100..100…"
        warmth:
          maximum: 100
          minimum: -100
          type: number
          description: "Make the colour warmer (+) or cooler (-), -100..100: 'warmer', 'cozier', 'less cold', 'golden' → +30..+60; 'cooler', 'less yellow/orange' → -30..-60. Use this instead of setting wb.temp by hand: it…"
        look_file:
          format: skillnet-file
          type: string
          x-accept:
            - .json
          description: look.json from an earlier grade_photo / adjust_area / retouch_photo call, to build on those edits.
        preview_size:
          default: 2048
          description: Long edge in px of the graded image returned (full-size files come from export_photos).
          maximum: 8192
          minimum: 256
          type: integer
      required:
        - photo
      type: object
    output_schema:
      additionalProperties: false
      properties:
        applied:
          additionalProperties:
            type: number
          description: Every slider now away from its default (control id → value).
          type: object
        preset:
          anyOf:
            - type: string
            - type: "null"
        profile:
          anyOf:
            - type: string
            - type: "null"
        treatment:
          type: string
        before:
          additionalProperties: false
          properties:
            mean_luminance:
              type: number
            clipped_highlights_pct:
              type: number
            clipped_shadows_pct:
              type: number
            contrast_std:
              type: number
            mean_saturation:
              type: number
            warmth:
              description: "Mean red minus blue: higher = warmer. after - before shows the colour temperature change."
              type: number
          required:
            - mean_luminance
            - clipped_highlights_pct
            - clipped_shadows_pct
            - contrast_std
            - mean_saturation
            - warmth
          type: object
        after:
          additionalProperties: false
          properties:
            mean_luminance:
              type: number
            clipped_highlights_pct:
              type: number
            clipped_shadows_pct:
              type: number
            contrast_std:
              type: number
            mean_saturation:
              type: number
            warmth:
              description: "Mean red minus blue: higher = warmer. after - before shows the colour temperature change."
              type: number
          required:
            - mean_luminance
            - clipped_highlights_pct
            - clipped_shadows_pct
            - contrast_std
            - mean_saturation
            - warmth
          type: object
        rejected_controls:
          items:
            type: string
          type: array
        white_balance_temp:
          type: number
          description: wb.temp the graded image uses (6500 = as shot on JPEGs, Kelvin on raws).
      required:
        - applied
        - preset
        - profile
        - treatment
        - before
        - after
        - rejected_controls
      type: object
    long_running: false
    timeout_s: 300
  - name: inspect_photo
    title: Inspect a photo before editing
    kind: inspect
    description: "Start here with any photo the user wants improved, graded or retouched. Reads the format (JPEG, PNG, TIFF, WebP, DNG and camera raws), size, camera/lens/ISO/shutter/aperture, embedded Lightroom edits, and measures brightness, clipped highlights/shadows and colour cast. Returns a 1024 px preview and suggested starting sliders for grade_photo. Read-only: the original is never changed."
    input_schema:
      additionalProperties: false
      properties:
        photo:
          description: "The photo to look at: JPEG, PNG, TIFF, WebP, JPEG XL, AVIF, DNG or a camera raw (CR2/CR3/NEF/ARW/RAF/RW2/ORF/PEF…). A file id from upload_file or an https URL."
          format: skillnet-file
          type: string
          x-accept:
            - .3fr
            - .arw
            - .avif
            - .cr2
            - .cr3
            - .crw
            - .dng
            - .erf
            - .heic
            - .heif
            - .hif
            - .iiq
            - .jpeg
            - .jpg
            - .jxl
            - .kdc
            - .mef
            - .mos
            - .mrw
            - .nef
            - .nrw
            - .orf
            - .pef
            - .png
            - .psd
            - .raf
            - .raw
            - .rw2
            - .rwl
            - .sr2
            - .srf
            - .srw
            - .tif
            - .tiff
            - .webp
            - .x3f
      required:
        - photo
      type: object
    output_schema:
      additionalProperties: false
      properties:
        format:
          type: string
        width:
          type: integer
        height:
          type: integer
        is_raw:
          type: boolean
        preview_only:
          type: string
          description: Set when only the raw's embedded JPEG preview could be read (reason).
        camera:
          anyOf:
            - type: string
            - type: "null"
        lens:
          anyOf:
            - type: string
            - type: "null"
        iso:
          anyOf:
            - type: number
            - type: "null"
        shutter:
          anyOf:
            - type: string
            - type: "null"
        aperture:
          anyOf:
            - type: number
            - type: "null"
        focal_mm:
          anyOf:
            - type: number
            - type: "null"
        capture_time:
          anyOf:
            - type: string
            - type: "null"
        has_edit_sidecar:
          description: True when the file carries embedded Lightroom/Camera Raw (XMP crs) edit settings.
          type: boolean
        mean_luminance:
          description: 0 (black) .. 1 (white); ~0.4-0.5 is a typical well-exposed photo.
          type: number
        clipped_highlights_pct:
          description: "% of pixels with a colour channel at maximum."
          type: number
        clipped_shadows_pct:
          description: "% of pixels that are pure black."
          type: number
        contrast_std:
          type: number
        mean_saturation:
          type: number
        warmth:
          description: "Mean red minus blue over the whole frame: below about -0.015 reads cool/cold, above +0.015 warm. Compare with grade_photo's before/after warmth."
          type: number
        cast:
          description: warm, cool, green, magenta, neutral or unknown (from near-grey mid-tones).
          type: string
        cast_strength:
          type: number
        suggestions:
          items:
            additionalProperties: false
            properties:
              control:
                description: A slider id for grade_photo's adjustments, or 'warmth' (grade_photo's own warmth argument).
                type: string
              value:
                type: number
              why:
                type: string
            required:
              - control
              - value
              - why
            type: object
          type: array
      required:
        - format
        - width
        - height
        - is_raw
        - camera
        - lens
        - iso
        - shutter
        - aperture
        - focal_mm
        - capture_time
        - has_edit_sidecar
        - mean_luminance
        - clipped_highlights_pct
        - clipped_shadows_pct
        - contrast_std
        - mean_saturation
        - warmth
        - cast
        - cast_strength
        - suggestions
      type: object
    long_running: false
    timeout_s: 180
  - name: list_looks
    title: List looks and adjustment controls
    kind: inspect
    description: Use when choosing a style ('golden hour', 'teal and orange', 'faded film', 'black and white', 'moody') or when you need exact slider ids and ranges for grade_photo, adjust_area or retouch_photo. Returns the built-in preset looks grouped by style, colour profiles, and develop controls (id, range, default), optionally filtered by panel or search text. Call after inspect_photo, before grade_photo.
    input_schema:
      additionalProperties: false
      properties:
        what:
          default: looks
          description: looks = preset looks and colour profiles; controls = slider ids with ranges for grade_photo/adjust_area; both.
          enum:
            - looks
            - controls
            - both
          type: string
        section:
          enum:
            - light
            - color
            - effects
            - curve
            - grading
            - mixer
            - bw
            - detail
            - optics
            - geometry
            - crop
            - mask
          type: string
          description: "Only controls of one panel: light, color (white balance, vibrance), effects (clarity, dehaze, vignette, grain), curve, grading (colour wheels), mixer (HSL), bw, detail (sharpen/noise), optics…"
        search:
          maxLength: 60
          type: string
          description: Text to match in ids, names or groups, e.g. 'film', 'b&w', 'warm'.
      type: object
    output_schema:
      additionalProperties: false
      properties:
        presets:
          items:
            additionalProperties: false
            properties:
              id:
                type: string
              name:
                type: string
              group:
                type: string
            required:
              - id
              - name
              - group
            type: object
          type: array
        profiles:
          items:
            additionalProperties: false
            properties:
              id:
                type: string
              name:
                type: string
              group:
                type: string
            required:
              - id
              - name
              - group
            type: object
          type: array
        controls:
          items:
            additionalProperties: false
            properties:
              id:
                type: string
              label:
                type: string
              min:
                type: number
              max:
                type: number
              default:
                type: number
            required:
              - id
              - label
              - min
              - max
              - default
            type: object
          type: array
        total_controls:
          type: integer
      required:
        - presets
        - profiles
        - controls
        - total_controls
      type: object
    long_running: false
    timeout_s: 120
  - name: retouch_photo
    title: Crop, straighten and clean up a photo
    kind: repair
    description: Use for 'crop to 4:5 / square / 16:9', 'straighten the horizon', 'fix converging lines', 'remove dust spots or blemishes', 'fix red eye', 'sharpen', 'reduce noise', 'fix lens distortion'. Applies crop/aspect, rotation or automatic straighten/upright, non-generative spot healing at given points (or automatic dust finding), red-eye, sharpening, noise reduction and lens corrections, on top of an optional look_file. Returns the retouched image, a before/after and an updated look.json. Use after grade_photo, before export_photos; the original is never modified.
    input_schema:
      additionalProperties: false
      properties:
        photo:
          description: The photo (file id or https URL); never modified.
          format: skillnet-file
          type: string
          x-accept:
            - .3fr
            - .arw
            - .avif
            - .cr2
            - .cr3
            - .crw
            - .dng
            - .erf
            - .heic
            - .heif
            - .hif
            - .iiq
            - .jpeg
            - .jpg
            - .jxl
            - .kdc
            - .mef
            - .mos
            - .mrw
            - .nef
            - .nrw
            - .orf
            - .pef
            - .png
            - .psd
            - .raf
            - .raw
            - .rw2
            - .rwl
            - .sr2
            - .srf
            - .srw
            - .tif
            - .tiff
            - .webp
            - .x3f
        aspect:
          enum:
            - original
            - free
            - "1:1"
            - "4:5"
            - "5:4"
            - "5:7"
            - "7:5"
            - "2:3"
            - "3:2"
            - "4:3"
            - "3:4"
            - "16:9"
            - "9:16"
            - "16:10"
            - "10:16"
          type: string
          description: Crop to this width:height ratio, as given (4:5 and 9:16 are portrait, 16:9 landscape). 'Instagram portrait' = 4:5, 'square' = 1:1, 'widescreen' = 16:9. The largest centred crop of that shape is used…
        crop_box:
          maxItems: 4
          minItems: 4
          prefixItems:
            - type: number
            - type: number
            - type: number
            - type: number
          type: array
          description: Explicit crop [x, y, width, height] as fractions 0-1 of the (straightened) frame, from the top-left.
        straighten:
          enum:
            - auto
            - level
            - vertical
            - full
          type: string
          description: auto = level a tilted horizon by rotating; level = upright to horizontal lines; vertical = fix converging verticals (buildings); full = level + vertical perspective.
        angle:
          maximum: 45
          minimum: -45
          type: number
          description: Rotate by this many degrees (positive = clockwise) to straighten.
        spots:
          description: Dust spots or blemishes to heal, each at x, y with a radius.
          items:
            additionalProperties: false
            properties:
              x:
                description: Spot centre, fraction of the width from the left.
                maximum: 1
                minimum: 0
                type: number
              "y":
                description: Spot centre, fraction of the height from the top.
                maximum: 1
                minimum: 0
                type: number
              radius:
                default: 0.015
                description: Spot radius, fraction of the long edge.
                exclusiveMinimum: 0
                maximum: 0.2
                type: number
              mode:
                default: heal
                description: heal = blend texture from a nearby patch (dust, blemish); clone = copy it exactly; remove = content-aware remove.
                enum:
                  - heal
                  - clone
                  - remove
                type: string
            required:
              - x
              - "y"
            type: object
          maxItems: 200
          type: array
        auto_dust:
          default: false
          description: Find small dark sensor-dust spots on smooth areas (sky) and heal them automatically.
          type: boolean
        red_eye:
          description: Eyes to fix red-eye in.
          items:
            additionalProperties: false
            properties:
              x:
                description: Eye centre x (fraction of width).
                maximum: 1
                minimum: 0
                type: number
              "y":
                description: Eye centre y (fraction of height).
                maximum: 1
                minimum: 0
                type: number
              radius:
                default: 0.02
                description: Eye radius, fraction of the long edge.
                exclusiveMinimum: 0
                maximum: 0.2
                type: number
            required:
              - x
              - "y"
            type: object
          maxItems: 20
          type: array
        sharpen:
          maximum: 150
          minimum: 0
          type: number
          description: Sharpening amount 0-150 (40 is a typical value).
        noise_reduction:
          maximum: 100
          minimum: 0
          type: number
          description: Luminance noise reduction 0-100 (also sets colour noise reduction to at least 25).
        lens_corrections:
          default: false
          description: Enable lens profile corrections (distortion, vignetting) and chromatic-aberration removal when the photo has lens data.
          type: boolean
        look_file:
          format: skillnet-file
          type: string
          x-accept:
            - .json
          description: look.json from an earlier call to build on.
        preview_size:
          default: 2048
          description: Long edge of the returned image, px.
          maximum: 8192
          minimum: 256
          type: integer
      required:
        - photo
      type: object
    output_schema:
      additionalProperties: false
      properties:
        width:
          description: Width of the returned preview, px.
          type: integer
        height:
          type: integer
        full_width:
          description: Width of the full-size result after crop, px (estimated from the crop).
          type: integer
        full_height:
          type: integer
        aspect_ratio:
          description: Width / height of the result.
          type: number
        rotation_deg:
          type: number
        upright:
          type: string
        spots_healed:
          type: integer
        dust_found:
          type: integer
        red_eyes_fixed:
          type: integer
        applied:
          additionalProperties:
            type: number
          type: object
      required:
        - width
        - height
        - full_width
        - full_height
        - aspect_ratio
        - rotation_deg
        - upright
        - spots_healed
        - dust_found
        - red_eyes_fixed
        - applied
      type: object
    long_running: false
    timeout_s: 400
datasets: []
workers:
  - name: export_chunk
    timeout_s: 1700
